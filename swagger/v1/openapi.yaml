---
openapi: 3.0.3
info:
  title: Fleet Manager API
  version: v1
  description: API documentation for vehicle fleet management system
servers:
- url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  "/api/v1/auth/register":
    post:
      summary: Register a new user
      tags:
      - Authentication
      description: Creates a new user account and returns a JWT authentication token
      parameters: []
      responses:
        '201':
          description: User successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT authentication token
                    example: eyJhbGciOiJIUzI1NiJ9...
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      email:
                        type: string
                        example: newuser@example.com
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                required:
                - token
                - user
        '422':
          description: Token generation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Token generation failed
                  details:
                    type: array
                    items:
                      type: string
                    example:
                    - Email is missing
        '400':
          description: Bad request - User wrapper missing
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid parameters
                  message:
                    type: string
                    example: 'param is missing or the value is empty: user'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      description: User email address
                      example: user@example.com
                    password:
                      type: string
                      format: password
                      description: User password (minimum 8 characters)
                      example: password123
                      minLength: 8
                  required:
                  - email
                  - password
              required:
              - user
  "/api/v1/auth/login":
    post:
      summary: User login
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      created_at:
                        type: string
                required:
                - token
                - user
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - code
                    - message
        '422':
          description: validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: object
                    required:
                    - code
                    - message
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      example: user@example.com
                    password:
                      type: string
                      example: password123
                  required:
                  - email
                  - password
              required:
              - user
  "/api/v1/vehicles/{vehicle_id}/maintenance_services":
    parameters:
    - name: vehicle_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: List maintenance services for a vehicle
      tags:
      - Maintenance Services
      security:
      - bearerAuth: []
      responses:
        '200':
          description: successful
        '404':
          description: vehicle not found
        '401':
          description: unauthorized
    post:
      summary: Create maintenance service
      tags:
      - Maintenance Services
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: created
        '422':
          description: validation failed
        '401':
          description: unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maintenance_service:
                  type: object
                  properties:
                    description:
                      type: string
                      example: Oil change
                    date:
                      type: string
                      format: date
                      example: '2024-01-15'
                    cost_cents:
                      type: integer
                      example: 5000
                    status:
                      type: string
                      example: pending
                    priority:
                      type: string
                      example: low
                  required:
                  - description
                  - date
                  - cost_cents
  "/api/v1/maintenance_services/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show maintenance service
      tags:
      - Maintenance Services
      security:
      - bearerAuth: []
      responses:
        '200':
          description: found
        '404':
          description: not found
    patch:
      summary: Update maintenance service
      tags:
      - Maintenance Services
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: updated
        '422':
          description: invalid params
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maintenance_service:
                  type: object
                  properties:
                    description:
                      type: string
                    status:
                      type: string
                    priority:
                      type: string
    delete:
      summary: Delete maintenance service
      tags:
      - Maintenance Services
      security:
      - bearerAuth: []
      responses:
        '204':
          description: deleted
        '404':
          description: not found
  "/api/v1/vehicles":
    get:
      summary: List vehicles
      tags:
      - Vehicles
      security:
      - bearerAuth: []
      responses:
        '200':
          description: successful
        '401':
          description: unauthorized
    post:
      summary: Create vehicle
      tags:
      - Vehicles
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: created
        '422':
          description: validation failed
        '401':
          description: unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle:
                  type: object
                  properties:
                    vin:
                      type: string
                      example: 1HGBH41JXMN109186
                    plate:
                      type: string
                      example: ABC1234
                    brand:
                      type: string
                      example: Toyota
                    model:
                      type: string
                      example: Camry
                    year:
                      type: integer
                      example: 2020
                    status:
                      type: string
                      example: active
                  required:
                  - vin
                  - plate
                  - brand
                  - model
                  - year
  "/api/v1/vehicles/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show vehicle
      tags:
      - Vehicles
      security:
      - bearerAuth: []
      responses:
        '200':
          description: found
        '404':
          description: not found
    patch:
      summary: Update vehicle
      tags:
      - Vehicles
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: updated
        '422':
          description: invalid params
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle:
                  type: object
                  properties:
                    brand:
                      type: string
                    model:
                      type: string
    delete:
      summary: Delete vehicle
      tags:
      - Vehicles
      security:
      - bearerAuth: []
      responses:
        '204':
          description: deleted
        '404':
          description: not found
